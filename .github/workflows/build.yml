name: Zig build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run unit tests
        run: zig build test
      - name: Compile the ZAPI plugin
        run: zig build check
      - name: Compile optimized plugin
        run: zig build -Doptimize=ReleaseFast
